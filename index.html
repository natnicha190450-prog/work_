    // -------------------------------------------------------------
    // 2. TIMEZONE & DATE FORMATTING (Asia/Bangkok UTC+7)
    // -------------------------------------------------------------
    function getTodayBangkokStr() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatThaiDateStr(dateStr) {
      if (!dateStr) return "-";
      const [y, m, d] = dateStr.split("-").map(Number);
      const months = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
      return `${d} ${months[m - 1]} ${y + 543}`;
    }

    // -------------------------------------------------------------
    // 3. BOOKING CONFLICT PREVENTION ENGINE [start, end)
    // -------------------------------------------------------------
    function hasIntervalOverlap(aStart, aEnd, bStart, bEnd) {
      return aStart < bEnd && aEnd > bStart;
    }

    function checkConflict(roomId, date, startStr, endStr, excludeBookingId = null) {
      if (endStr <= startStr) {
        return { hasConflict: true, message: "เวลาสิ้นสุดต้องมากกว่าเวลาเริ่มต้นการประชุม" };
      }

      const db = getDB();
      const room = db.rooms.find(r => r.id === roomId);
      if (!room) return { hasConflict: true, message: "ไม่พบห้องประชุม" };

      if (room.status !== "ACTIVE") {
        return { hasConflict: true, message: `ห้องประชุมนี้อยู่ในสถานะ ${room.status === 'MAINTENANCE' ? 'ปิดปรับปรุง' : 'ไม่เปิดให้บริการ'}` };
      }

      // Check all active bookings on the same date and room
      const sameDayBookings = db.bookings.filter(b => 
        b.roomId === roomId &&
        b.date === date &&
        b.id !== excludeBookingId &&
        (b.status === "APPROVED" || b.status === "PENDING")
      );

      for (const b of sameDayBookings) {
        if (hasIntervalOverlap(startStr, endStr, b.startTime, b.endTime)) {
          return {
            hasConflict: true,
            message: `ห้องนี้มีรายการจองซ้อนทับ: "${b.title}" (${b.startTime} - ${b.endTime} น.) [${b.status === 'APPROVED' ? 'อนุมัติแล้ว' : 'รออนุมัติ'}]`
          };
        }
      }

      return { hasConflict: false, message: "ห้องว่าง สามารถจองในช่วงเวลานี้ได้", requiresApproval: room.requiresApproval };
    }

    // -------------------------------------------------------------
    // 4. USER & ROLE STATE
    // -------------------------------------------------------------
    let currentUser = null;
    let currentView = "dashboard";

    function setInitialUser() {
      const db = getDB();
      const savedRoleId = localStorage.getItem("mrbs_current_role") || "u1"; // Default to Admin
      currentUser = db.users.find(u => u.id === savedRoleId) || db.users[0];
      updateUserUI();
    }

    function switchRole(roleName) {
      const db = getDB();
      const user = db.users.find(u => u.role === roleName);
      if (user) {
        currentUser = user;
        localStorage.setItem("mrbs_current_role", user.id);
        updateUserUI();
        navigate(currentView);
        showToast(`สลับบทบาทเป็น ${roleName} (${user.name}) เรียบร้อยแล้ว`);
      }
    }

    function updateUserUI() {
      document.getElementById("userNameDisplay").textContent = currentUser.name;
      document.getElementById("userAvatar").textContent = currentUser.name.charAt(0);

      const badge = document.getElementById("userRoleBadge");
      badge.textContent = currentUser.role;
      badge.className = `text-[10px] px-2 py-0.5 rounded-full font-bold ${
        currentUser.role === 'ADMIN' ? 'bg-purple-100 text-purple-700' :
        currentUser.role === 'APPROVER' ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700'
      }`;

      // Update role buttons
      ['Admin', 'Approver', 'User'].forEach(r => {
        const btn = document.getElementById(`btnRole${r}`);
        if (btn) {
          if (currentUser.role.toLowerCase() === r.toLowerCase()) {
            btn.className = "px-2.5 py-1 rounded-lg font-bold bg-white text-slate-900 shadow-sm";
          } else {
            btn.className = "px-2.5 py-1 rounded-lg font-semibold text-slate-500 hover:text-slate-900";
          }
        }
      });

      // Role visibility in sidebar
      const approverSection = document.getElementById("approverSection");
      const adminSection = document.getElementById("adminSection");
      approverSection.style.display = (currentUser.role === "ADMIN" || currentUser.role === "APPROVER") ? "block" : "none";
      adminSection.style.display = (currentUser.role === "ADMIN") ? "block" : "none";
    }

    // -------------------------------------------------------------
    // 5. NOTIFICATION CENTER
    // -------------------------------------------------------------
    function updateNotificationBadge() {
      const db = getDB();
      const unread = db.notifications.filter(n => !n.isRead).length;
      const badge = document.getElementById("notifBadge");
      if (unread > 0) {
        badge.textContent = unread;
        badge.classList.remove("hidden");
      } else {
        badge.classList.add("hidden");
      }
    }

    function toggleNotifications() {
      const dropdown = document.getElementById("notifDropdown");
      dropdown.classList.toggle("hidden");
      if (!dropdown.classList.contains("hidden")) {
        renderNotificationsList();
      }
    }

    function renderNotificationsList() {
      const db = getDB();
      const list = document.getElementById("notifList");
      if (db.notifications.length === 0) {
        list.innerHTML = `<div class="p-4 text-center text-slate-400">ไม่มีการแจ้งเตือน</div>`;
        return;
      }
      list.innerHTML = db.notifications.map(n => `
        <div class="p-3 hover:bg-slate-50 ${!n.isRead ? 'bg-blue-50/40' : ''}">
          <p class="font-bold text-slate-800">${n.title}</p>
          <p class="text-slate-500 mt-0.5">${n.message}</p>
          <span class="text-[10px] text-slate-400 mt-1 block">${n.time}</span>
        </div>
      `).join("");
    }

    function markAllNotificationsRead() {
      const db = getDB();
      db.notifications.forEach(n => n.isRead = true);
      saveDB(db);
      updateNotificationBadge();
      renderNotificationsList();
    }

    function showToast(message, type = "success") {
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      toast.className = `p-3.5 px-4 rounded-xl shadow-lg border text-xs font-semibold flex items-center gap-2 transform transition duration-300 pointer-events-auto ${
        type === 'success' ? 'bg-emerald-600 text-white border-emerald-500' : 'bg-rose-600 text-white border-rose-500'
      }`;
      toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" class="w-4 h-4"></i> <span>${message}</span>`;
      container.appendChild(toast);
      lucide.createIcons();
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(10px)';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // -------------------------------------------------------------
    // 6. ROUTER & VIEWS
    // -------------------------------------------------------------
    function navigate(viewName, params = {}) {
      currentView = viewName;
      document.querySelectorAll(".nav-item").forEach(el => {
        el.classList.remove("bg-blue-600", "text-white", "shadow-sm");
        el.classList.add("text-slate-600");
      });
      const activeNav = document.getElementById(`nav-${viewName}`);
      if (activeNav) {
        activeNav.classList.remove("text-slate-600");
        activeNav.classList.add("bg-blue-600", "text-white", "shadow-sm");
      }

      // Close mobile sidebar
      document.getElementById("sidebar").classList.add("-translate-x-full");

      const main = document.getElementById("mainContent");
      if (viewName === "dashboard") renderDashboard(main);
      else if (viewName === "calendar") renderCalendar(main);
      else if (viewName === "new-booking") renderNewBooking(main, params);
      else if (viewName === "rooms") renderRooms(main);
      else if (viewName === "my-bookings") renderMyBookings(main);
      else if (viewName === "approvals") renderApprovals(main);
      else if (viewName === "reports") renderReports(main);
      else if (viewName === "admin-rooms") renderAdminRooms(main);
      else if (viewName === "admin-users") renderAdminUsers(main);
      else if (viewName === "admin-settings") renderAdminSettings(main);

      lucide.createIcons();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function runLiveAvailabilityCheck() {
      const roomId = document.getElementById("bookRoomId")?.value;
      const date = document.getElementById("bookDate")?.value;
      const start = document.getElementById("bookStartTime")?.value;
      const end = document.getElementById("bookEndTime")?.value;

      if (!roomId || !date || !start || !end) return;

      const result = checkConflict(roomId, date, start, end);
      const banner = document.getElementById("availabilityBanner");
      const text = document.getElementById("availabilityText");
      const submitBtn = document.getElementById("btnSubmitBooking");

      if (result.hasConflict) {
        banner.className = "p-3.5 rounded-xl border border-rose-200 bg-rose-50 text-rose-800 text-xs font-semibold flex items-center gap-2";
        text.textContent = result.message;
        if (submitBtn) submitBtn.disabled = true;
      } else {
        banner.className = "p-3.5 rounded-xl border border-emerald-200 bg-emerald-50 text-emerald-800 text-xs font-semibold flex items-center gap-2";
        text.textContent = `${result.message} ${result.requiresApproval ? '(ห้องนี้ต้องรอการอนุมัติ)' : '(อนุมัติใช้งานได้ทันที)'}`;
        if (submitBtn) submitBtn.disabled = false;
      }
      lucide.createIcons();
    }

    function handleBookingSubmit(e) {
      e.preventDefault();
      const roomId = document.getElementById("bookRoomId").value;
      const date = document.getElementById("bookDate").value;
      const startTime = document.getElementById("bookStartTime").value;
      const endTime = document.getElementById("bookEndTime").value;
      const title = document.getElementById("bookTitle").value;
      const attendees = Number(document.getElementById("bookAttendees").value);
      const departmentName = document.getElementById("bookDept").value;
      const description = document.getElementById("bookDescription").value;

      // Final Conflict Re-validation
      const check = checkConflict(roomId, date, startTime, endTime);
      if (check.hasConflict) {
        showToast(check.message, "error");
        return;
      }

      const db = getDB();
      const room = db.rooms.find(r => r.id === roomId);
      const finalStatus = room.requiresApproval ? "PENDING" : "APPROVED";

      const newBooking = {
        id: "b_" + Date.now(),
        title,
        description,
        roomId,
        userId: currentUser.id,
        userName: currentUser.name,
        departmentName,
        date,
        startTime,
        endTime,
        attendees,
        status: finalStatus
      };

      db.bookings.unshift(newBooking);

      // Add Notification
      db.notifications.unshift({
        id: "n_" + Date.now(),
        title: finalStatus === "APPROVED" ? "จองห้องประชุมสำเร็จ" : "ส่งคำขอจองห้องเรียบร้อย",
        message: `รายการ "${title}" (${room.name}) สถานะ: ${finalStatus === 'APPROVED' ? 'อนุมัติแล้ว' : 'รอการอนุมัติ'}`,
        isRead: false,
        time: "เมื่อสักครู่"
      });

      // Add Audit Log
      db.auditLogs.unshift({
        action: "BOOKING_CREATED",
        user: currentUser.name,
        details: `จองห้อง ${room.name} สำหรับ "${title}"`,
        time: "เมื่อสักครู่"
      });

      saveDB(db);
      updateNotificationBadge();
      showToast(finalStatus === "APPROVED" ? "จองห้องสำเร็จ ได้รับการอนุมัติทันที!" : "ส่งคำขอจองเรียบร้อย อยู่ระหว่างรออนุมัติ");
      navigate("my-bookings");
    }

    function handleApprovalAction(bookingId, action) {
      const reason = action === 'REJECT' ? prompt("กรุณาระบุเหตุผลในการปฏิเสธการจอง:") : "";
      if (action === 'REJECT' && reason === null) return;

      const db = getDB();
      const b = db.bookings.find(item => item.id === bookingId);
      if (b) {
        b.status = action === 'APPROVE' ? 'APPROVED' : 'REJECTED';
        b.rejectReason = reason || "";
        db.auditLogs.unshift({
          action: action === 'APPROVE' ? 'BOOKING_APPROVED' : 'BOOKING_REJECTED',
          user: currentUser.name,
          details: `พิจารณาคำขอ "${b.title}" (${action})`,
          time: "เมื่อสักครู่"
        });
        saveDB(db);
        showToast(action === 'APPROVE' ? "อนุมัติการจองเรียบร้อยแล้ว" : "ปฏิเสธคำขอจองเรียบร้อยแล้ว");
        navigate("approvals");
      }
    }

        return {

          "สถานะ": b.status

                        u.role === 'ADMIN' ? 'bg-purple-100 text-purple-700' :
                        u.role === 'APPROVER' ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700'
                      }">
                        ${u.role}
                      </span>
                    </td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // -------------------------------------------------------------
    // VIEW 10: ADMIN SETTINGS & AUDIT LOGS
    // -------------------------------------------------------------
    function renderAdminSettings(container) {
      const db = getDB();
      container.innerHTML = `
        <div class="space-y-6">
          <div>
            <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">การตั้งค่าและบันทึกการตรวจสอบ (Audit Logs)</h1>
            <p class="text-xs text-slate-500 mt-0.5">ประวัติการทำรายการทั้งหมดในระบบ</p>
          </div>

          <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
            <h3 class="text-sm font-bold text-slate-800">บันทึกการตรวจสอบ (Audit Trail)</h3>
            <div class="divide-y divide-slate-100 text-xs">
              ${db.auditLogs.map(log => `
                <div class="py-2.5 flex items-center justify-between">
                  <div>
                    <span class="font-bold text-slate-800">${log.action}</span>
                    <p class="text-slate-500 mt-0.5">${log.details} • โดย ${log.user}</p>
                  </div>
                  <span class="text-[10px] text-slate-400">${log.time}</span>
                </div>
              `).join("")}
            </div>
          </div>
        </div>
      `;
    }

    // -------------------------------------------------------------
    // MODAL DIALOGS
    // -------------------------------------------------------------
    function showBookingDetail(bookingId) {
      const db = getDB();
      const b = db.bookings.find(item => item.id === bookingId);
      if (!b) return;
      const room = db.rooms.find(r => r.id === b.roomId);

      const overlay = document.getElementById("modalOverlay");
      const content = document.getElementById("modalContent");

      content.innerHTML = `
        <div class="flex items-start justify-between pb-3 border-b border-slate-100">
          <div>
            <span class="text-[10px] font-bold text-slate-400 uppercase">รายละเอียดการจอง</span>
            <h3 class="text-base font-bold text-slate-900 mt-0.5">${b.title}</h3>
          </div>
          <button onclick="closeModal()" class="p-1 rounded-lg text-slate-400 hover:text-slate-600">✕</button>
        </div>
        <div class="py-4 space-y-2.5 text-xs">
          <div class="flex justify-between"><span class="text-slate-500">ห้อง:</span><span class="font-bold text-slate-800">${room ? room.name : '-'}</span></div>
          <div class="flex justify-between"><span class="text-slate-500">วันและเวลา:</span><span class="font-bold text-slate-800">${formatThaiDateStr(b.date)} (${b.startTime} - ${b.endTime} น.)</span></div>
          <div class="flex justify-between"><span class="text-slate-500">ผู้ขอจอง:</span><span class="font-bold text-slate-800">${b.userName}</span></div>
          <div class="flex justify-between"><span class="text-slate-500">แผนก:</span><span class="font-bold text-slate-800">${b.departmentName || '-'}</span></div>
          <div class="flex justify-between"><span class="text-slate-500">สถานะ:</span><span class="font-bold text-blue-600">${b.status}</span></div>
          ${b.description ? `<div class="pt-2 border-t text-slate-600 bg-slate-50 p-2.5 rounded-xl">${b.description}</div>` : ''}
        </div>
        <div class="pt-3 border-t border-slate-100 text-right">
          <button onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700">ปิดหน้าต่าง</button>
        </div>
      `;
      overlay.classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("modalOverlay").classList.add("hidden");
    }

    // -------------------------------------------------------------
    // INITIALIZATION
    // -------------------------------------------------------------
    window.addEventListener("DOMContentLoaded", () => {
      setInitialUser();
      updateNotificationBadge();
      navigate("dashboard");

      document.getElementById("mobileMenuBtn").addEventListener("click", () => {
        document.getElementById("sidebar").classList.remove("-translate-x-full");
      });
      document.getElementById("closeSidebarBtn").addEventListener("click", () => {
        document.getElementById("sidebar").classList.add("-translate-x-full");
      });
    });
  </script>
</body>
</html>
